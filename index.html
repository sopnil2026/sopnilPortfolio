<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>Sopnil Portfolio</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link data-keep rel="preconnect" href="https://fonts.googleapis.com">
<link data-keep rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link data-keep rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Figtree:wght@400;600;700&family=DM+Mono:wght@400;500&display=swap">
<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font:14px system-ui,sans-serif}
img{max-width:100%}
[hidden]{display:none!important}
</style>
<script data-keep src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script data-keep src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script data-keep src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<style id="app-style">/* Layout concept: green ribbon header, an opening stage where a medal swings over a floating certificate, a slanted amber skills band, then calm card sections. */
:root{
  --bg:#f2f6ef; --surface:#ffffff; --surface2:#e8efe4; --ink:#13281b; --muted:#53695a; --line:#d3dfcf;
  --forest:#1f4a30; --forest-ink:#f2f8ee; --amber:#f5a800; --amber-ink:#1d2a05; --amber-soft:#fff1c9; --danger:#b3261e;
  --shadow:0 18px 40px -22px rgba(19,40,27,.45);
  --f-display:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;
  --f-body:"Figtree","Segoe UI",system-ui,sans-serif;
  --f-mono:"DM Mono",ui-monospace,Menlo,monospace;
}



*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0 40px;overflow-x:hidden}
h1,h2,h3{font-family:var(--f-display);line-height:1.08;margin:0;text-wrap:balance;letter-spacing:-.02em}
p{margin:0}
a{color:inherit}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
.wrap{max-width:1120px;margin-inline:auto;min-width:0}
.mono{font-family:var(--f-mono)}

/* header */
.nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;margin-top:12px}
.nav-in{display:flex;align-items:center;gap:12px;background:var(--forest);color:var(--forest-ink);border-radius:999px;padding:8px 8px 8px 14px;box-shadow:var(--shadow)}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-weight:800;font-size:1.15rem;text-decoration:none;margin-right:auto;min-width:0}
.brand i{width:30px;height:30px;border-radius:50%;background:var(--amber);color:var(--amber-ink);display:grid;place-items:center;font-style:normal;font-size:.95rem;flex:none}
.links{display:none;gap:22px;font-weight:600;font-size:.95rem}
.links a{text-decoration:none;opacity:.85}.links a:hover{opacity:1;color:var(--amber)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:2px solid transparent;border-radius:999px;padding:11px 20px;font-weight:700;cursor:pointer;text-decoration:none;background:var(--amber);color:var(--amber-ink);transition:transform .15s,box-shadow .15s}
.btn:hover{transform:translateY(-2px);box-shadow:0 10px 20px -10px var(--amber)}
.btn.ghost{background:transparent;border-color:currentColor;color:var(--ink)}
.btn.dark{background:var(--forest);color:var(--forest-ink)}
.btn.danger{background:transparent;border-color:var(--danger);color:var(--danger)}
.btn.sm{padding:7px 14px;font-size:.88rem}
.icon-btn{width:38px;height:38px;border-radius:50%;border:0;background:rgba(255,255,255,.12);color:var(--forest-ink);cursor:pointer;display:grid;place-items:center;flex:none}
.icon-btn svg{width:18px;height:18px}

/* hero */
.hero{padding-top:34px;padding-bottom:26px}
.hero-grid{display:grid;gap:30px;align-items:center}
.hello{display:inline-block;border:1.5px dashed var(--amber);padding:4px 12px;border-radius:6px;font-family:var(--f-mono);font-size:.9rem;margin-bottom:16px}
.hero h1{font-size:clamp(2.3rem,9.5vw,4.6rem);font-weight:800}
.hero h1 em{font-style:normal;color:var(--amber);display:block}
.roles{margin-top:14px;font-weight:700;font-size:1.05rem;display:flex;flex-wrap:wrap;gap:8px}
.roles span{background:var(--surface2);border-radius:999px;padding:4px 12px;font-size:.9rem}
.lead{margin-top:16px;color:var(--muted);max-width:52ch;font-size:1.05rem}
.cta-row{margin-top:24px;display:flex;flex-wrap:wrap;gap:12px}
.stage{position:relative;min-height:440px;display:grid;place-items:center;perspective:1000px;isolation:isolate}
.stage::before{content:"";position:absolute;width:min(78%,360px);aspect-ratio:1;border-radius:46% 54% 50% 50%;background:var(--amber);opacity:.9;z-index:-1;animation:blob 9s ease-in-out infinite}
@keyframes blob{50%{border-radius:56% 44% 42% 58%;transform:rotate(8deg) scale(1.04)}}
.fan{position:relative;width:min(100%,380px);aspect-ratio:4/3;transform-style:preserve-3d}
.fan .cc{position:absolute;inset:0;border-radius:10px;overflow:hidden;box-shadow:0 26px 44px -18px rgba(0,0,0,.55);background:#fff;transition:transform .8s cubic-bezier(.2,.9,.2,1),opacity .6s;cursor:pointer;border:0;padding:0}
.fan .cc img{width:100%;height:100%;object-fit:contain;display:block;background:#fff}
.fan .cc::after{content:none}
@keyframes shine{0%{transform:translateX(-120%)}45%,100%{transform:translateX(120%)}}
.medal{position:absolute;top:-6px;right:6%;width:84px;transform-origin:50% 0;animation:swing 4.2s ease-in-out infinite,drop 1.4s cubic-bezier(.2,.9,.25,1.1) both;filter:drop-shadow(0 14px 12px rgba(0,0,0,.35));z-index:3;pointer-events:none}
.medal img{width:100%;display:block}
@keyframes swing{0%,100%{rotate:7deg}50%{rotate:-7deg}}
@keyframes drop{from{translate:0 -120%;opacity:0}to{translate:0 0;opacity:1}}
.avatar{position:absolute;left:0;bottom:6px;display:flex;align-items:center;gap:10px;background:var(--surface);border-radius:999px;padding:6px 16px 6px 6px;box-shadow:var(--shadow);z-index:3;animation:rise 1s .6s both}
.avatar img{width:48px;height:48px;border-radius:50%;object-fit:cover;object-position:50% 20%}
.avatar b{display:block;font-size:.92rem;line-height:1.15}.avatar small{color:var(--muted);font-size:.78rem}
@keyframes rise{from{translate:0 24px;opacity:0}to{translate:0 0;opacity:1}}
.spark{position:absolute;width:10px;height:10px;background:var(--amber);border-radius:2px;rotate:45deg;animation:tw 2.4s ease-in-out infinite;z-index:2}
@keyframes tw{50%{scale:1.8;opacity:.3}}
.hint{position:absolute;bottom:-4px;right:0;font-family:var(--f-mono);font-size:.75rem;color:var(--muted)}
.fade-up{animation:rise .9s both}
.d1{animation-delay:.1s}.d2{animation-delay:.25s}.d3{animation-delay:.4s}.d4{animation-delay:.55s}

/* band */
.band{margin:34px -50vw 0;margin-left:calc(50% - 50vw);margin-right:calc(50% - 50vw);width:100vw;overflow:hidden;background:var(--amber);color:var(--amber-ink);transform:rotate(-1.6deg);padding:14px 0;border-block:4px solid var(--forest)}
.band-track{display:flex;gap:36px;width:max-content;animation:marq 26s linear infinite;font-family:var(--f-display);font-weight:800;font-size:clamp(1.2rem,4.5vw,1.9rem);white-space:nowrap}
.band-track span::after{content:"\2733";margin-left:36px}
@keyframes marq{to{transform:translateX(-50%)}}

/* sections */
.sec{padding-block:72px 8px}
.eyebrow{display:flex;align-items:center;gap:10px;font-family:var(--f-mono);font-size:.85rem;color:var(--muted);text-transform:uppercase;letter-spacing:.12em;margin-bottom:10px}
.eyebrow::before{content:"";width:18px;height:3px;background:var(--amber);border-radius:2px}
.sec h2{font-size:clamp(1.9rem,6vw,3rem);font-weight:800}
.sec h2 em{font-style:normal;color:var(--amber)}
.sec-sub{margin-top:12px;color:var(--muted);max-width:56ch}
.grid{display:grid;gap:18px;margin-top:30px}
.cert-card{background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:var(--shadow);display:flex;flex-direction:column;min-width:0}
.cert-card .thumb{display:block;border:0;padding:0;background:var(--surface2);cursor:zoom-in;aspect-ratio:4/3;overflow:hidden}
.cert-card .thumb img{width:100%;height:100%;object-fit:contain;display:block;background:#fff}
.cert-card:hover .thumb img{transform:none}
.cert-card .body{padding:16px 18px 20px;display:grid;gap:8px}
.cert-card h3{font-size:1.2rem}
.tag{display:inline-block;background:var(--amber-soft);color:var(--ink);border-radius:999px;padding:3px 11px;font-size:.78rem;font-weight:700;width:fit-content}
.meta{color:var(--muted);font-size:.9rem}

.about-grid{display:grid;gap:30px;align-items:center}
.portrait{position:relative;max-width:380px;width:100%;margin-inline:auto}
.portrait::before{content:"";position:absolute;inset:14% -6% -6% 10%;background:var(--forest);border-radius:26px;z-index:0}
.portrait img{position:relative;z-index:1;width:100%;display:block;border-radius:26px 26px 26px 120px;aspect-ratio:4/5;object-fit:cover;object-position:50% 12%;background:#fff}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:14px;margin-top:26px}
.fact{border-top:3px solid var(--amber);padding-top:8px}
.fact b{display:block;font-family:var(--f-display);font-size:1.7rem;line-height:1.1}
.fact span{color:var(--muted);font-size:.88rem}

.skill{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:22px;display:grid;gap:12px;min-width:0}
.skill .ic{width:48px;height:48px;border-radius:14px;background:var(--forest);color:var(--amber);display:grid;place-items:center}
.skill .ic svg{width:26px;height:26px}
.skill h3{font-size:1.25rem}
.skill .top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.pct{font-family:var(--f-mono);font-weight:500;font-size:.95rem;font-variant-numeric:tabular-nums}
.bar{height:10px;border-radius:99px;background:var(--surface2);overflow:hidden}
.bar i{display:block;height:100%;width:var(--w);background:linear-gradient(90deg,var(--forest),var(--amber));border-radius:99px;transform-origin:left;animation:grow 1.4s .3s cubic-bezier(.2,.9,.2,1) both}
@keyframes grow{from{transform:scaleX(0)}}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chips span{background:var(--surface2);border-radius:8px;padding:3px 10px;font-size:.82rem}

.tl{display:grid;gap:0;margin-top:30px;border-left:3px solid var(--line);margin-left:6px}
.tl-item{position:relative;padding:0 0 28px 24px;min-width:0}
.tl-item::before{content:"";position:absolute;left:-10px;top:4px;width:17px;height:17px;border-radius:50%;background:var(--amber);border:4px solid var(--bg)}
.tl-item .yr{font-family:var(--f-mono);color:var(--muted);font-size:.85rem}
.tl-item h3{font-size:1.2rem;margin:2px 0 4px}
.tl-item p{color:var(--muted);max-width:60ch}

.link-card{display:flex;gap:16px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:20px;text-decoration:none;min-width:0;transition:transform .2s,border-color .2s}
.link-card:hover{transform:translateY(-3px);border-color:var(--amber)}
.link-card .ic{flex:none;width:46px;height:46px;border-radius:50%;background:var(--forest);color:var(--amber);display:grid;place-items:center}
.link-card .ic svg{width:22px;height:22px}
.link-card h3{font-size:1.1rem}.link-card p{color:var(--muted);font-size:.93rem;margin-top:3px}
.link-card .addr{font-family:var(--f-mono);font-size:.82rem;word-break:break-all;margin-top:6px;display:block;color:var(--ink)}
.contact{margin-top:22px;background:var(--forest);color:var(--forest-ink);border-radius:26px;padding:26px;display:grid;gap:20px}
.contact h3{font-size:1.7rem}.contact p{opacity:.85}
.form{display:grid;gap:12px}
.form label{font-size:.85rem;font-weight:700;display:grid;gap:5px}
.in{width:100%;border:2px solid var(--line);background:var(--surface);color:var(--ink);border-radius:12px;padding:11px 13px;min-width:0}
.contact .in{border-color:transparent}
textarea.in{min-height:110px;resize:vertical}
.status{min-height:1.3em;font-size:.88rem;color:var(--amber)}
footer{margin-top:72px;padding-top:26px;border-top:1px solid var(--line);display:flex;flex-wrap:wrap;gap:10px 24px;justify-content:space-between;color:var(--muted);font-size:.9rem}
footer b{color:var(--ink)}

/* lightbox + toast */
.lb{position:fixed;inset:0;z-index:80;background:rgba(5,12,8,.88);display:grid;place-items:center;padding:calc(20px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));animation:rise .3s both}
.lb figure{margin:0;max-width:1100px;width:100%;display:grid;gap:12px;color:#fff;justify-items:center}
.lb img{max-height:78vh;width:auto;max-width:100%;border-radius:8px;background:#fff}
.lb .x{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));right:max(14px,env(safe-area-inset-right,0px))}
.toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));translate:-50% 0;z-index:120;background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-weight:600;font-size:.92rem;max-width:90vw}

/* admin */
.fab{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:60;box-shadow:var(--shadow)}
.admin{position:fixed;inset:0;z-index:100;background:var(--bg);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
.ad-head{display:flex;align-items:center;gap:10px;padding:12px max(16px,env(safe-area-inset-right,0px)) 12px max(16px,env(safe-area-inset-left,0px));background:var(--forest);color:var(--forest-ink)}
.ad-head h2{font-size:1.15rem;margin-right:auto}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:10px max(16px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--line);flex:none}
.tab{border:0;background:var(--surface2);border-radius:999px;padding:8px 16px;font-weight:700;cursor:pointer;white-space:nowrap}
.tab[aria-selected="true"]{background:var(--amber);color:var(--amber-ink)}
.ad-body{flex:1;overflow-y:auto;padding:18px max(16px,env(safe-area-inset-right,0px)) 110px max(16px,env(safe-area-inset-left,0px))}
.ad-inner{max-width:760px;margin-inline:auto;display:grid;gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;display:grid;gap:12px;min-width:0}
.card h3{font-size:1.05rem}
.fld{display:grid;gap:5px;font-size:.85rem;font-weight:700}
.two{display:grid;gap:12px}
.row-actions{display:flex;flex-wrap:wrap;gap:8px}
.up{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.up img{width:90px;height:68px;object-fit:cover;border-radius:8px;border:1px solid var(--line);background:var(--surface2)}
.savebar{position:fixed;left:0;right:0;bottom:0;z-index:110;background:var(--surface);border-top:1px solid var(--line);padding:12px max(16px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.savebar .msg{margin-right:auto;font-size:.9rem;color:var(--muted)}
.empty{color:var(--muted);text-align:center;padding:18px}

@media (min-width:760px){
  .links{display:flex}
  .nav-in{padding-left:20px}
  .hero{padding-top:56px}
  .hero-grid{grid-template-columns:1.05fr .95fr}
  .stage{min-height:540px}
  .medal{width:110px}
  .grid.c2{grid-template-columns:repeat(2,1fr)}
  .grid.c3{grid-template-columns:repeat(3,1fr)}
  .about-grid{grid-template-columns:.8fr 1.2fr}
  .contact{grid-template-columns:1fr 1fr;padding:36px}
  .two{grid-template-columns:1fr 1fr}
  .cert-grid{grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition:none!important;scroll-behavior:auto!important}
}

/* scroll reveal + float */
.rv{transition:opacity .8s,translate .8s cubic-bezier(.2,.9,.2,1)}
.rv-hide{opacity:0;translate:0 30px}
.fan{animation:floaty 6s ease-in-out infinite}
@keyframes floaty{50%{translate:0 -10px}}
.hero-copy{min-width:0}

/* owner-only controls, filters, projects, extras */
.own{display:none}
.is-owner .own{display:inline-flex}
.hide-empty{display:none}
.toolbar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;margin-top:22px}
.toolbar:empty{display:none}
.chips-f{display:flex;flex-wrap:wrap;gap:8px;min-width:0}
.chip{border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:6px 15px;font-weight:700;font-size:.88rem;cursor:pointer}
.chip.on{background:var(--forest);color:var(--forest-ink);border-color:var(--forest)}
.nav-in .btn.sm.own{background:transparent;border-color:var(--amber);color:var(--amber)}
.typed-line{margin-top:12px;font-family:var(--f-mono);font-size:1.05rem;min-height:1.6em}
.typed-line b{color:var(--amber);font-weight:500}
.caret{display:inline-block;width:2px;height:1.05em;background:var(--amber);margin-left:3px;vertical-align:-.15em;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.proj{background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden;display:flex;flex-direction:column;min-width:0;box-shadow:var(--shadow)}
.proj .pimg{aspect-ratio:16/10;background:var(--surface2);overflow:hidden}
.proj .pimg img{width:100%;height:100%;object-fit:cover;display:block}
.proj .body{padding:16px 18px 20px;display:grid;gap:8px;justify-items:start}
.progress{position:fixed;top:0;left:0;right:0;height:4px;background:var(--amber);transform:scaleX(0);transform-origin:left;z-index:90}
.totop{position:fixed;left:max(16px,env(safe-area-inset-left,0px));bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:55;width:44px;height:44px;border-radius:50%;border:0;background:var(--amber);color:var(--amber-ink);cursor:pointer;display:grid;place-items:center;box-shadow:var(--shadow)}
.totop svg{rotate:-90deg}
.totop[hidden]{display:none}
.lbn{position:absolute;top:50%;translate:0 -50%}
.lbn.l{left:max(10px,env(safe-area-inset-left,0px))}.lbn.l svg{rotate:180deg}
.lbn.r{right:max(10px,env(safe-area-inset-right,0px))}
.lb .icon-btn{background:rgba(255,255,255,.18)}
.drop{border:2px dashed var(--amber);border-radius:16px;padding:20px;text-align:center;background:var(--amber-soft);display:grid;gap:8px;justify-items:center}
.drop.over{background:var(--amber);color:var(--amber-ink)}

/* logo photo in the top bar */
.brand img.logo{width:36px;height:36px;border-radius:50%;object-fit:cover;object-position:50% 20%;border:2px solid var(--amber);flex:none;background:#fff}

/* messages in admin */
.msg-item{border-top:1px solid var(--line);padding-top:12px;display:grid;gap:4px;min-width:0}
.msg-item b{word-break:break-all}
.msg-item p{white-space:pre-wrap;word-break:break-word}

/* stop the slanted band from widening the page on phones */
html,body{overflow-x:clip}
.band{max-width:100vw}

/* phone fixes: medal beside the certificate, back-to-top on the right */
.fan{width:min(92%,360px);justify-self:center}
.medal{right:3%;width:68px}
@media (min-width:760px){
  .fan{width:min(100%,380px);justify-self:center}
  .medal{right:6%;width:110px}
}
.totop{left:auto;right:max(16px,env(safe-area-inset-right,0px))}
.is-owner .totop{bottom:calc(76px + env(safe-area-inset-bottom,0px))}
.sec{scroll-margin-top:92px}
</style>
</head>

   rules_version = '2';
   service cloud.firestore {

       match /messages/{id} {
         allow create: if request.resource.data.keys().hasOnly(['email','message','createdAt'])
           && request.resource.data.email is string && request.resource.data.email.size() < 200
           && request.resource.data.message is string && request.resource.data.message.size() > 0
           && request.resource.data.message.size() < 2000
           && request.resource.data.createdAt == request.time;
         allow read, delete: if request.auth != null && request.auth.token.email == 'sopnilprodhan13@gmail.com';
         allow update: if false;
       }
     }
   }
*/
var OWNER_EMAIL="sopnilprodhan13@gmail.com";
var FIREBASE_CONFIG={
  apiKey:"AIzaSyDkoruSlsM3s69Gv4wcNdEwDCu4irWJ2Bk",

var OWNER_HASH="c7dc6fa03b7a11577e90fb897deb76583cdce2a20eb8af5e5081359f16dadf21";
var SALT="sopnil-portfolio:";
/* =============================================== */

function fbConfigured(){return !!(window.firebase&&FIREBASE_CONFIG.apiKey&&FIREBASE_CONFIG.apiKey.indexOf("PASTE")!==0)}
var auth=null,db=null,fbApp=null;
function initFb(){
  if(auth&&db)return true;
  if(!fbConfigured())return false;
  try{
    /* Reuse an app pointed at this exact Firebase project; do not accidentally
       attach authentication/messages to a different pre-initialized project. */
    var apps=(firebase.apps||[]);
    fbApp=apps.filter(function(a){return a&&a.options&&a.options.projectId===FIREBASE_CONFIG.projectId})[0]||null;
    if(!fbApp){
      var baseName="sopnilPortfolioMessaging";
      var named=apps.filter(function(a){return a&&a.name===baseName})[0]||null;
      if(named&&named.options&&named.options.projectId===FIREBASE_CONFIG.projectId){
        fbApp=named;
      }else{
        var appName=named?baseName+"_"+FIREBASE_CONFIG.projectId:baseName;
        fbApp=firebase.initializeApp(FIREBASE_CONFIG,appName);
      }
    }
    auth=firebase.auth(fbApp);
    db=firebase.firestore(fbApp);
    return !!(auth&&db);
  }catch(e){
    auth=null;db=null;fbApp=null;
    console.error("Firebase initialization failed:",e);
    return false;
  }
}
function sha256(txt){
  var enc=new TextEncoder().encode(SALT+txt);
  return crypto.subtle.digest("SHA-256",enc).then(function(buf){
    return Array.prototype.map.call(new Uint8Array(buf),function(b){return ("0"+b.toString(16)).slice(-2)}).join("");
  });
}
function openOwner(){if(window.__admin){window.__admin.unlock();window.__admin.open("msgs")}}
var tries=0,lockUntil=0,lastOwnerLoginError="";
window.__ownerLoginError=function(){return lastOwnerLoginError};

/* Hidden admin sign-in: only password-like entries trigger Firebase login; ordinary messages remain normal. */
window.__ownerTry=function(email,pass){
  if(String(email).trim().toLowerCase()!==OWNER_EMAIL){lastOwnerLoginError="This email is not authorized for the admin panel.";return Promise.resolve(false)}
  var say=function(t){lastOwnerLoginError=t||""};
  say("");
  if(Date.now()<lockUntil){say("Too many tries. Wait a minute.");return Promise.resolve("bad")}
  var fail=function(t){tries++;if(tries>=5){lockUntil=Date.now()+60000;tries=0}say(t);return "bad"};
  if(fbConfigured()){
    if(!initFb()){
      say("Firebase could not initialize. Check the Firebase configuration and internet connection.");
      return Promise.resolve("bad");
    }
    say("Checking...");
    return auth.signInWithEmailAndPassword(OWNER_EMAIL,String(pass==null?"":pass).trim()).then(function(){
      tries=0;say("");openOwner();return true;
    },function(err){
      var c=err&&err.code||"";
      if(c==="auth/network-request-failed")return fail("No internet connection. Please try again.");
      if(c==="auth/too-many-requests")return fail("Too many login attempts. Wait a few minutes.");
      if(c==="auth/operation-not-allowed")return fail("Firebase Console → Authentication → Sign-in method: enable Email/Password.");
      if(c==="auth/unauthorized-domain")return fail("This website domain is not authorized in Firebase Authentication settings.");
      if(c==="auth/invalid-api-key"||c==="auth/app-not-authorized")return fail("Firebase API key or app authorization is incorrect.");
      if(c==="auth/user-disabled")return fail("This Firebase Authentication user has been disabled.");
      if(c==="auth/user-not-found")return fail("Admin email was not found in this Firebase project's Authentication → Users.");
      if(c==="auth/invalid-email")return fail("The admin email address is invalid.");
      if(c==="auth/wrong-password"||c==="auth/invalid-credential"){
        var wantsReset=false;
        try{wantsReset=window.confirm("Firebase rejected this password. Send a password-reset link to "+OWNER_EMAIL+" if this account exists?")}catch(confirmErr){}
        if(wantsReset){
          return auth.sendPasswordResetEmail(OWNER_EMAIL).then(function(){
            say("Password-reset email requested. Check the inbox and spam folder; if this Firebase account exists, use the link to set a new password, then sign in again.");
            return "bad";
          },function(resetErr){
            var rc=resetErr&&resetErr.code||"unknown-error";
            return fail("Could not send password reset ("+rc+"). Check that Email/Password is enabled and the admin user exists in this Firebase project.");
          });
        }
        return fail("Firebase rejected this email/password. The code cannot override Firebase credentials. Confirm the user in Authentication → Users, then reset its password if needed.");
      }
      return fail("Firebase login failed ("+(c||"unknown error")+"). Check Authentication settings and the owner account.");
    });
  }
  if(!(window.crypto&&crypto.subtle)){say("Login needs a secure page (https).");return Promise.resolve("bad")}
  return sha256(pass.trim()).then(function(h){
    if(h!==OWNER_HASH)return fail("Wrong email or password.");
    tries=0;try{sessionStorage.setItem("owner-ok",OWNER_HASH)}catch(e){}
    openOwner();return true;
  });
};

/* Optional legacy prompt login helper; no visible button is rendered for it. */
window.__ownerAdminLogin=function(){
  if(auth&&auth.currentUser&&auth.currentUser.email&&auth.currentUser.email.toLowerCase()===OWNER_EMAIL){
    openOwner();
    return;
  }
  var email=window.prompt("Admin email",OWNER_EMAIL);
  if(email===null)return;
  if(String(email).trim().toLowerCase()!==OWNER_EMAIL){
    window.alert("This email is not authorized for the admin panel.");
    return;
  }
  var pass=window.prompt("Admin password");
  if(pass===null)return;
  lastOwnerLoginError="";
  window.__ownerTry(email,pass).then(function(result){
    if(result!==true){
      window.alert(lastOwnerLoginError||"Admin login failed. Check your email and password.");
    }
  }).catch(function(){
    window.alert(lastOwnerLoginError||"Admin login failed. Check your Firebase settings and internet connection.");
  });
};

/* Visitor messages are saved to Firestore. Never silently switch to copy/email fallback. */
window.__sendMessage=function(email,message){
  if(!initFb())return Promise.reject({code:"not-configured"});
  return db.collection("messages").add({
    email:String(email).trim().slice(0,199),
    message:String(message).trim().slice(0,1999),
    createdAt:firebase.firestore.FieldValue.serverTimestamp()
  });
};

/* Used by the admin panel. */
window.__loadMessages=function(){
  if(!initFb())return Promise.reject({code:"not-configured"});
  return db.collection("messages").orderBy("createdAt","desc").limit(200).get().then(function(snap){
    return snap.docs.map(function(d){
      var x=d.data(),t=x.createdAt&&x.createdAt.toDate?x.createdAt.toDate():null;
      return {id:d.id,email:x.email||"",message:x.message||"",date:t?t.toLocaleString():""};
    });
  },function(e){throw {code:(e&&e.code)||"error"}});
};
window.__deleteMessage=function(id){
  if(!initFb())return Promise.reject({code:"not-configured"});
  return db.collection("messages").doc(id).delete();
};

/* Load and save the portfolio content separately from visitor messages. */
window.__loadSiteContent=function(){
  if(!initFb())return Promise.resolve(null);
  return db.collection("siteContent").doc("portfolio").get().then(function(snap){
    if(!snap.exists)return null;
    var row=snap.data();
    return row&&row.data&&typeof row.data==="object"?row.data:null;
  }).catch(function(err){
    window.__siteContentLoadError=err&&err.code||"read-failed";
    console.warn("Portfolio content could not be loaded from Firebase:",err);
    return null;
  });
};
window.__saveSiteContent=function(state){
  if(!initFb())return Promise.reject({code:"not-configured"});
  var user=auth&&auth.currentUser;
  if(!user||!user.email||user.email.toLowerCase()!==OWNER_EMAIL){
    return Promise.reject({code:"unauthenticated"});
  }
  var serialized;
  try{serialized=JSON.stringify(state)}catch(e){return Promise.reject({code:"serialize-failed"})}
  /* Firestore limits a document to 1 MiB; keep a buffer for metadata/encoding. */
  var byteSize=(typeof Blob!=="undefined")?new Blob([serialized]).size:serialized.length;
  if(byteSize>850000)return Promise.reject({code:"too_large"});
  return db.collection("siteContent").doc("portfolio").set({
    data:state,
    updatedAt:firebase.firestore.FieldValue.serverTimestamp()
  });
};

/* Keep the owner signed in on this device. */
window.addEventListener("load",function(){
  if(initFb()){
    auth.onAuthStateChanged(function(u){
      if(u&&u.email&&u.email.toLowerCase()===OWNER_EMAIL&&window.__admin)window.__admin.unlock();
    });
    return;
  }
  var ok=false;try{ok=sessionStorage.getItem("owner-ok")===OWNER_HASH}catch(e){}
  if(ok&&window.__admin)window.__admin.unlock();
});
})();

function countUp(){
  var els=$$(".fact b");
  els.forEach(function(el){
    var n=parseInt(el.textContent,10);if(isNaN(n)||n===0)return;
    el.textContent="0";
    var run=function(){var t0=null;function f(t){if(!t0)t0=t;var k=Math.min(1,(t-t0)/900);el.textContent=String(Math.round(n*(1-Math.pow(1-k,3))));if(k<1)requestAnimationFrame(f)}requestAnimationFrame(f)};
    if(!("IntersectionObserver" in window)){el.textContent=String(n);return}
    var io=new IntersectionObserver(function(es){if(es[0].isIntersecting){io.disconnect();run()}});io.observe(el);
    setTimeout(function(){if(el.textContent==="0"){io.disconnect();el.textContent=String(n)}},7000);
  });
}

function bindSite(){
  var site=$("#site");
  site.onclick=function(e){
    var go=e.target.closest("[data-go]");
    if(go){e.preventDefault();var t=$("#"+go.getAttribute("data-go"));if(t)t.scrollIntoView({behavior:"smooth",block:"start"});return}
    var ow=e.target.closest("[data-own]");if(ow){
      var ownAction=ow.getAttribute("data-own");
      if(ownAction==="admin"&&window.__ownerAdminLogin){window.__ownerAdminLogin();return}
      if(window.__own)window.__own(ownAction);
      return;
    }
    var ct=e.target.closest("[data-cat]");if(ct){filterCat=ct.getAttribute("data-cat");paintCerts();return}
    if(e.target.closest("#toTop")){window.scrollTo({top:0,behavior:"smooth"});return}
    var op=e.target.closest("[data-open]");if(op){openLb(op.getAttribute("data-open"));return}
    var cp=e.target.closest("[data-copy]");if(cp){copyText(cp.getAttribute("data-copy"));return}
    var fc=e.target.closest("[data-fan]");
    if(fc){var i=+fc.getAttribute("data-fan");if(i===fanIdx){openLb(S.certificates[i].id)}else{fanIdx=i;layoutFan();startFan()}return}
    if(e.target.closest("#themeBtn")){toggleTheme()}
  };
  var f=$("#msgForm");
  if(f)f.onsubmit=function(e){
    e.preventDefault();
    /* Ignore only a second click while the current request is in flight.
       Once it completes, the same sender may submit another message normally. */
    if(f.dataset.sending==="1")return;
    var n=$("#mName").value.trim(),m=$("#mText").value.trim(),st=$("#mStatus");
    var submitBtn=f.querySelector('button[type="submit"]');
    if(!n||!m){st.textContent="Please enter your email and a message.";return}
    f.dataset.sending="1";
    if(submitBtn)submitBtn.disabled=true;
    var finish=function(){
      f.dataset.sending="";
      if(submitBtn)submitBtn.disabled=false;
    };
    var send=function(){
      st.textContent="Sending...";
      window.__sendMessage(n,m).then(function(){
        $("#mName").value="";$("#mText").value="";st.textContent="Thank you! Your message was sent.";
      },function(err){
        console.error("Message could not be saved to Firebase:",err);
        var code=err&&err.code||"";
        if(code==="permission-denied")st.textContent="Message not saved: Firestore Rules are blocking public message creation. Check and publish the messages rule.";
        else if(code==="not-configured")st.textContent="Message service is not connected. Check the Firebase setup and internet connection.";
        else if(code==="failed-precondition"||code==="not-found")st.textContent="Message not saved: create Firestore Database in this Firebase project, then try again.";
        else if(code==="unavailable"||code==="network-request-failed")st.textContent="Message not saved: connection problem. Check your internet and try again.";
        else st.textContent="Message not saved ("+(code||"unknown error")+"). Check Firebase Firestore setup and rules.";
      }).then(finish,finish);
    };
    /* The owner email is the hidden login entry. Other email addresses use
       the public message flow. Repeated messages from the same other email
       are allowed; only simultaneous duplicate submissions are ignored. */
    var ownerLoginAttempt=String(n).trim().toLowerCase()==="sopnilprodhan13@gmail.com";
    if(ownerLoginAttempt&&window.__ownerTry){
      st.textContent="Checking admin login...";
      window.__ownerTry(n,m).then(function(result){
        if(result===true){
          $("#mName").value="";$("#mText").value="";
          st.textContent="";
          return;
        }
        st.textContent=(window.__ownerLoginError&&window.__ownerLoginError())||"Admin login failed. Check your Firebase email and password.";
      }).catch(function(){
        st.textContent=(window.__ownerLoginError&&window.__ownerLoginError())||"Admin login failed. Check Firebase Authentication and internet connection.";
      }).then(finish,finish);
      return;
    }
    send();
  };
  var st=$("#stage");
  if(st){
    st.onpointermove=function(e){
      if(e.pointerType==="touch")return;
      var r=st.getBoundingClientRect(),x=(e.clientX-r.left)/r.width-.5,y=(e.clientY-r.top)/r.height-.5;
      var fan=$("#fan");if(fan){fan.style.transition="transform .15s";fan.style.transform="rotateY("+(x*16)+"deg) rotateX("+(-y*14)+"deg)"}
    };
    st.onpointerleave=function(){var fan=$("#fan");if(fan){fan.style.transition="transform .8s";fan.style.transform=""}};
  }
}

function startFan(){

    saving=false;
    if(adminEl){
      var cs=adminEl.querySelectorAll("input,textarea,select,button");
      Array.prototype.forEach.call(cs,function(el){el.disabled=false});
      var bb=$("#adSave");if(bb)bb.textContent="Save Changes";
    }
    msg("Saved successfully. Changes are now live for visitors.");
  }).catch(function(err){
    saving=false;
    if(adminEl){
      var cs=adminEl.querySelectorAll("input,textarea,select,button");
      Array.prototype.forEach.call(cs,function(el){el.disabled=false});
      var bb=$("#adSave");if(bb)bb.textContent="Save Changes";
    }
    var c=err&&err.code||"unknown-error";
    if(c==="permission-denied")msg("Save failed: publish the updated Firestore Rules from the provided rules file, then sign in again.");
    else if(c==="unauthenticated")msg("Admin session is not signed in to Firebase. Log in again, then save.");
    else if(c==="not-configured")msg("Firebase is not configured or could not initialize. Check the Firebase configuration.");
    else if(c==="too_large")msg("The content is too large for one Firestore document. Use smaller images and try again.");
    else msg("Save failed ("+c+"). Check your connection and Firestore Rules, then try again.");
    console.error("Portfolio save failed:",err);
  });
}

function boot(){
  if(!window.claude||!window.claude.use)return;
  Promise.all([window.claude.use("user"),window.claude.use("artifact")]).then(function(r){
    var user=r[0];art=r[1];if(!art||!user)return;
    return user.canEdit().then(function(ok){
      if(!ok)return;
      /* Keep owner-only controls hidden until the hidden owner login succeeds. */
      document.body.classList.remove("is-owner");
      window.__own=function(a){
        if(a==="admin")openAdmin("profile");
        else if(a==="addcert")openAdmin("certs");
        else if(a==="addproj"){openAdmin("proj");var arr=draft.projects;arr.unshift({id:"p"+Date.now(),title:"",tag:"",desc:"",link:"",img:""});setDirty();paint()}
      };
    });
  }).catch(function(){});
}

window.__admin={open:function(t){openAdmin(t)},unlock:function(){
  art={publish:function(html){return new Promise(function(res){
    var bl=new Blob([html],{type:"text/html"}),a=document.createElement("a");
    a.href=URL.createObjectURL(bl);a.download="index.html";document.body.appendChild(a);a.click();a.remove();
    setTimeout(function(){URL.revokeObjectURL(a.href)},4000);res({});
  })}};
  /* Keep the panel entry point hidden; login is triggered by the contact form credentials. */
  document.body.classList.add("is-owner");
  window.__own=function(a){
    if(a==="admin")openAdmin("profile");
    else if(a==="addcert")openAdmin("certs");
    else if(a==="addproj"){openAdmin("proj");var arr=draft.projects;arr.unshift({id:"p"+Date.now(),title:"",tag:"",desc:"",link:"",img:""});setDirty();paint()}
  };
}};
boot();
})();
</script>
